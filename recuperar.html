<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Recuperar acceso · Glovta</title><link rel="stylesheet" href="portal.css"><script src="recuperar.js" defer></script></head>
<body><header>GLOVTA</header><main><h1>Elegí tu nueva contraseña</h1>
<form id="recovery" hidden>
<label>Nueva contraseña<input name="password" type="password" autocomplete="new-password" minlength="12" maxlength="128" required></label>
<label>Repetir contraseña<input name="confirmation" type="password" autocomplete="new-password" minlength="12" maxlength="128" required></label>
<p>Usá entre 12 y 128 caracteres y guardá tu contraseña.</p><button>Guardar contraseña</button></form>
<p id="status" role="status" aria-live="polite"></p><a id="login-link" href="portal.html">Ir al inicio de sesión</a></main></body></html>
